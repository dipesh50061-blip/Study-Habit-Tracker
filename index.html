<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Study & Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0f11;
  --surface:#16181c;
  --surface2:#1e2027;
  --border:#2a2d35;
  --accent:#c8f135;
  --accent2:#7b61ff;
  --text:#f0f0ee;
  --muted:#6b7080;
  --danger:#ff5e5e;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Space Mono',monospace}

.app{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.header{padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface)}
.logo{display:flex;align-items:center;gap:10px}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.logo h1{font-size:1rem;letter-spacing:0.08em;font-weight:700;color:var(--accent)}
.user-badge{font-size:0.8rem;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:0.05em}

.main{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 57px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 0;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-label{font-size:0.65rem;letter-spacing:0.12em;color:var(--muted);padding:0.4rem 1.5rem;margin-top:1rem;text-transform:uppercase;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:0.6rem 1.5rem;cursor:pointer;border-left:3px solid transparent;transition:all 0.15s;font-size:0.88rem;color:var(--muted)}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{border-left-color:var(--accent);background:var(--surface2);color:var(--accent)}
.nav-icon{font-size:1rem;width:18px;text-align:center}

.content{padding:2rem;overflow-y:auto}
.page-title{font-size:1.4rem;margin-bottom:0.3rem;color:var(--text)}
.page-sub{font-size:0.85rem;color:var(--muted);margin-bottom:2rem}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:2rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.2rem}
.stat-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem}
.stat-val{font-size:1.6rem;font-family:'Space Mono',monospace;color:var(--accent);font-weight:700;line-height:1.2}
.stat-unit{font-size:0.75rem;color:var(--muted);margin-top:2px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.4rem;margin-bottom:1rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.card-title{font-size:0.95rem;font-weight:600;color:var(--text)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:6px}
label{font-size:0.78rem;color:var(--muted);letter-spacing:0.04em}
input,select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.85rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.15s;width:100%}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
select option{background:var(--surface2)}

.time-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.time-row select{width:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0.6rem 1.2rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;border:none;transition:all 0.15s}
.btn-primary{background:var(--accent);color:#0e0f11}
.btn-primary:hover{background:#d9ff4a;transform:translateY(-1px)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:0.35rem 0.7rem;font-size:0.78rem}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);padding:0.35rem 0.7rem;font-size:0.78rem}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2)}

.list-item{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.item-info{display:flex;flex-direction:column;gap:3px;flex:1}
.item-name{font-size:0.92rem;font-weight:500}
.item-meta{font-size:0.76rem;color:var(--muted)}
.item-actions{display:flex;gap:6px}
.time-badge{font-family:'Space Mono',monospace;font-size:0.82rem;background:var(--surface2);border:1px solid var(--border);padding:0.2rem 0.6rem;border-radius:20px;color:var(--accent);white-space:nowrap}

.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:0.8rem;opacity:0.3}
.empty-text{font-size:0.9rem}

.search-bar{display:flex;gap:8px;margin-bottom:1.2rem}
.search-bar input{flex:1}

.sort-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.sort-bar label{font-size:0.8rem;color:var(--muted);white-space:nowrap}
.sort-btn{font-size:0.78rem;padding:0.3rem 0.7rem;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.1s;font-family:'DM Sans',sans-serif}
.sort-btn.active{background:var(--surface2);color:var(--accent);border-color:var(--accent)}

.edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.edit-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.8rem;width:100%;max-width:420px}
.edit-title{font-size:1rem;margin-bottom:1.2rem;color:var(--accent);font-family:'Space Mono',monospace}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--surface2);border:1px solid var(--accent);border-radius:10px;padding:0.8rem 1.2rem;font-size:0.85rem;z-index:200;animation:slideIn 0.25s ease;display:flex;align-items:center;gap:8px;pointer-events:none}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.dot-accent{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}

.progress-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s ease}

.name-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1.5rem;padding:2rem;text-align:center}
.name-input-wrap{display:flex;gap:10px;width:100%;max-width:360px}
.name-input-wrap input{flex:1;font-size:1rem;padding:0.8rem 1rem}
.name-input-wrap .btn{padding:0.8rem 1.4rem;font-size:1rem;white-space:nowrap}

@media(max-width:640px){
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{flex-direction:row;flex-wrap:wrap;padding:0.5rem;border-right:none;border-bottom:1px solid var(--border);height:auto;overflow-x:auto}
  .nav-label{display:none}
  .nav-item{padding:0.4rem 0.8rem;font-size:0.8rem;border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  .nav-item.active{border-left-color:transparent;border-bottom-color:var(--accent)}
  .content{padding:1rem}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEYS={s:'sht2_sessions',h:'sht2_habits',u:'sht2_user'};
const load=k=>{try{const d=localStorage.getItem(k);return d?JSON.parse(d):null}catch{return null}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const ts=()=>new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const uid=()=>Math.random().toString(36).slice(2,9);
const toMin=(v,u)=>u==='h'?v*60:v;
const fmtMin=m=>{const h=Math.floor(m/60),mn=m%60;if(h&&mn)return h+'h '+mn+'m';return h?h+'h':mn+'m';};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const div=(cls,html)=>mk('div',cls,html);

let S={
  user:load(KEYS.u)||null,
  sessions:load(KEYS.s)||[],
  habits:load(KEYS.h)||[],
  page:'dashboard',
  toast:null,toastTimer:null,
  editItem:null,editType:null,
  search:'',sort:'time-desc'
};

function set(patch){Object.assign(S,patch);render();}
function flush(){save(KEYS.s,S.sessions);save(KEYS.h,S.habits);save(KEYS.u,S.user);}

function toast(msg){
  clearTimeout(S.toastTimer);
  const t=setTimeout(()=>set({toast:null,toastTimer:null}),2500);
  set({toast:msg,toastTimer:t});
}

// CRUD
function addSess(name,mins){S.sessions.push({id:uid(),subject:name,timing:mins,ts:ts()});flush();toast('Study session added ✓');render();}
function delSess(id){if(!confirm('Delete this session?'))return;S.sessions=S.sessions.filter(x=>x.id!==id);flush();toast('Session deleted');render();}
function saveSessEdit(id,name,mins){const x=S.sessions.find(x=>x.id===id);if(x){x.subject=name;x.timing=mins;flush();toast('Session updated ✓');}set({editItem:null,editType:null});}
function addHab(name,mins){S.habits.push({id:uid(),habit:name,timing:mins,ts:ts()});flush();toast('Habit added ✓');render();}
function delHab(id){if(!confirm('Delete this habit?'))return;S.habits=S.habits.filter(x=>x.id!==id);flush();toast('Habit deleted');render();}
function saveHabEdit(id,name,mins){const x=S.habits.find(x=>x.id===id);if(x){x.habit=name;x.timing=mins;flush();toast('Habit updated ✓');}set({editItem:null,editType:null});}

// Time widget
function makeTimeWidget(pfx){
  const wrap=div('time-row');
  const ni=mk('input','');ni.type='number';ni.min='1';ni.placeholder='e.g. 90';
  const sel=mk('select','','<option value="m">Min</option><option value="h">Hours</option>');
  wrap.appendChild(ni);wrap.appendChild(sel);
  return{
    wrap,
    get(){const v=parseInt(ni.value);return(!v||v<=0)?null:toMin(v,sel.value);},
    set(m){if(m%60===0&&m>0){ni.value=m/60;sel.value='h';}else{ni.value=m;sel.value='m';}},
    clear(){ni.value='';sel.value='m';}
  };
}

// Filtered + sorted list
function filtered(arr,nk){
  let list=[...arr];
  if(S.search){const q=S.search.toLowerCase();list=list.filter(i=>i[nk].toLowerCase().includes(q));}
  if(S.sort==='time-desc')list.sort((a,b)=>b.timing-a.timing);
  else if(S.sort==='time-asc')list.sort((a,b)=>a.timing-b.timing);
  else list.sort((a,b)=>a[nk].localeCompare(b[nk]));
  return list;
}

// Add form card
function addFormCard(type){
  const isSess=type==='session';
  const card=div('card');
  card.appendChild(div('card-header',`<div class="card-title">${isSess?'➕ Add Study Session':'➕ Add Habit'}</div>`));

  const grid=div('form-grid');
  const ng=div('form-group',`<label>${isSess?'Subject Name':'Habit Name'}</label>`);
  const ni=mk('input');ni.type='text';ni.placeholder=isSess?'e.g. Mathematics':'e.g. Morning Reading';
  ng.appendChild(ni);grid.appendChild(ng);

  const tg=div('form-group','<label>Duration</label>');
  const tw=makeTimeWidget('add-'+type);
  tg.appendChild(tw.wrap);grid.appendChild(tg);
  card.appendChild(grid);

  const btn=mk('button','btn btn-primary',isSess?'Add Session':'Add Habit');
  btn.style.marginTop='1rem';
  btn.onclick=()=>{
    const name=ni.value.trim(),mins=tw.get();
    if(!name)return toast('Please enter a name');
    if(!mins)return toast('Please enter a valid duration');
    isSess?addSess(name,mins):addHab(name,mins);
    ni.value='';tw.clear();
  };
  ni.onkeydown=e=>{if(e.key==='Enter')btn.click();};
  card.appendChild(btn);
  return card;
}

// Search + sort toolbar
function toolbar(nameKey){
  const wrap=div('');
  const sb=div('search-bar');
  const si=mk('input');si.type='text';si.placeholder=nameKey==='subject'?'Search subjects…':'Search habits…';si.value=S.search;
  si.oninput=e=>set({search:e.target.value});
  sb.appendChild(si);wrap.appendChild(sb);

  const sbar=div('sort-bar','<label>Sort by:</label>');
  [['time-desc','Time ↓'],['time-asc','Time ↑'],['name','Name A–Z']].forEach(([v,l])=>{
    const b=mk('button','sort-btn'+(S.sort===v?' active':''),l);
    b.onclick=()=>set({sort:v});sbar.appendChild(b);
  });
  wrap.appendChild(sbar);
  return wrap;
}

// List item row
function itemRow(item,nk,isSess,maxT){
  const row=div('list-item');
  const pct=maxT>0?Math.round((item.timing/maxT)*100):0;
  const a2=!isSess;

  const info=div('item-info');
  info.innerHTML=`
    <div class="item-name">${esc(item[nk])}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%${a2?';background:var(--accent2)':''}"></div></div>
    <div class="item-meta">${item.ts}</div>`;

  const right=div('');right.style.cssText='display:flex;align-items:center;gap:8px;margin-left:12px';
  const badge=div('time-badge',fmtMin(item.timing));
  if(a2)badge.style.cssText='color:var(--accent2);border-color:var(--accent2)';
  right.appendChild(badge);

  const acts=div('item-actions');
  const eb=mk('button','btn btn-ghost','✏️ Edit');
  const db=mk('button','btn btn-danger','✕');
  eb.onclick=()=>set({editItem:item,editType:isSess?'session':'habit'});
  db.onclick=()=>isSess?delSess(item.id):delHab(item.id);
  acts.appendChild(eb);acts.appendChild(db);right.appendChild(acts);

  row.appendChild(info);row.appendChild(right);
  return row;
}

// ── PAGES ──
function nameScreen(){
  const wrap=div('name-screen');
  wrap.innerHTML=`
    <div style="font-family:'Space Mono',monospace;font-size:2.5rem;color:var(--accent);letter-spacing:0.06em;font-weight:700">STUDY+HABITS</div>
    <p style="color:var(--muted);max-width:340px;line-height:1.6;font-size:0.95rem">Your personal tracker for study sessions and daily habits.<br>All data is saved locally in your browser.</p>
    <div class="name-input-wrap">
      <input id="ni" type="text" placeholder="Enter your name..." maxlength="30"/>
      <button class="btn btn-primary" id="nb">Start →</button>
    </div>
    <p style="font-size:0.75rem;color:var(--muted)">Press Enter or click Start</p>`;
  wrap.querySelector('#nb').onclick=()=>{
    const v=wrap.querySelector('#ni').value.trim();
    if(!v)return toast('Please enter your name');
    S.user=v;flush();set({page:'dashboard'});
  };
  wrap.querySelector('#ni').onkeydown=e=>{if(e.key==='Enter')wrap.querySelector('#nb').click();};
  return wrap;
}

function sidebar(){
  const pages=[{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'sessions',icon:'📚',label:'Study Sessions'},{id:'habits',icon:'✅',label:'Habits'}];
  const sb=div('sidebar');
  sb.innerHTML=`<div style="padding:0 1.5rem 1.2rem;border-bottom:1px solid var(--border)"><div class="logo"><div class="logo-dot"></div><h1>TRACKER</h1></div></div>`;
  sb.appendChild(div('nav-label','Navigation'));
  pages.forEach(p=>{
    const item=div('nav-item'+(S.page===p.id?' active':''),`<span class="nav-icon">${p.icon}</span>${p.label}`);
    item.onclick=()=>set({page:p.id,search:'',sort:'time-desc'});
    sb.appendChild(item);
  });
  const foot=div('');
  foot.style.cssText='margin-top:auto;padding:1rem 1.5rem;border-top:1px solid var(--border)';
  foot.innerHTML=`<div style="font-size:0.75rem;color:var(--muted);margin-bottom:4px">👤 ${esc(S.user)}</div>
    <button id="chname" style="background:none;border:none;color:var(--muted);font-size:0.75rem;cursor:pointer;font-family:inherit;padding:0;text-decoration:underline">Change name</button>`;
  foot.querySelector('#chname').onclick=()=>{S.user=null;flush();set({page:'dashboard'});};
  sb.appendChild(foot);
  return sb;
}

function dashboard(){
  const ts=S.sessions.reduce((a,x)=>a+x.timing,0);
  const th=S.habits.reduce((a,x)=>a+x.timing,0);
  const wrap=div('');
  wrap.innerHTML=`<h2 class="page-title">Dashboard</h2><p class="page-sub">Welcome back, ${esc(S.user)} — here's your overview</p>`;

  const g=div('stats-grid');
  [{label:'Study Sessions',val:S.sessions.length,unit:'total sessions'},{label:'Total Study Time',val:fmtMin(ts),unit:'hrs & minutes'},
   {label:'Habits Tracked',val:S.habits.length,unit:'total habits'},{label:'Total Habit Time',val:fmtMin(th),unit:'hrs & minutes'}
  ].forEach(x=>g.innerHTML+=`<div class="stat-card"><div class="stat-label">${x.label}</div><div class="stat-val">${x.val}</div><div class="stat-unit">${x.unit}</div></div>`);
  wrap.appendChild(g);

  if(S.sessions.length>0){
    const sc=div('card');
    const maxT=Math.max(...S.sessions.map(x=>x.timing));
    sc.innerHTML=`<div class="card-header"><div class="card-title">📚 Recent Study Sessions</div><span class="time-badge">${fmtMin(ts)} total</span></div>`;
    [...S.sessions].slice(-5).reverse().forEach(x=>{
      const pct=Math.round((x.timing/maxT)*100);
      sc.innerHTML+=`<div class="list-item"><div class="item-info" style="flex:1"><div class="item-name">${esc(x.subject)}</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="item-meta">${x.ts}</div></div><div class="time-badge" style="margin-left:12px">${fmtMin(x.timing)}</div></div>`;
    });
    wrap.appendChild(sc);
  }
  if(S.habits.length>0){
    const hc=div('card');
    const maxT=Math.max(...S.habits.map(x=>x.timing));
    hc.innerHTML=`<div class="card-header"><div class="card-title">✅ Recent Habits</div><span class="time-badge" style="color:var(--accent2);border-color:var(--accent2)">${fmtMin(th)} total</span></div>`;
    [...S.habits].slice(-5).reverse().forEach(x=>{
      const pct=Math.round((x.timing/maxT)*100);
      hc.innerHTML+=`<div class="list-item"><div class="item-info" style="flex:1"><div class="item-name">${esc(x.habit)}</div><div class="progress-bar" style="margin-top:4px"><div class="progress-fill" style="width:${pct}%;background:var(--accent2)"></div></div><div class="item-meta">${x.ts}</div></div><div class="time-badge" style="margin-left:12px;color:var(--accent2);border-color:var(--accent2)">${fmtMin(x.timing)}</div></div>`;
    });
    wrap.appendChild(hc);
  }
  if(!S.sessions.length&&!S.habits.length)
    wrap.appendChild(div('card','<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">No data yet. Use the sidebar to add study sessions or habits!</div></div>'));
  return wrap;
}

function sessionsPage(){
  const wrap=div('');
  wrap.innerHTML=`<h2 class="page-title">Study Sessions</h2><p class="page-sub">Manage your study schedule</p>`;
  wrap.appendChild(addFormCard('session'));

  const tot=S.sessions.reduce((a,x)=>a+x.timing,0);
  const lc=div('card');
  lc.innerHTML=`<div class="card-header"><div class="card-title">All Sessions (${S.sessions.length})</div><span class="time-badge">${fmtMin(tot)} total</span></div>`;
  lc.appendChild(toolbar('subject'));
  const list=filtered(S.sessions,'subject');
  if(!list.length){
    lc.innerHTML+=`<div class="empty"><div class="empty-icon">📚</div><div class="empty-text">${S.search?'No sessions match your search':'No sessions yet — add one above!'}</div></div>`;
  } else {
    const mx=Math.max(...list.map(x=>x.timing));
    list.forEach(x=>lc.appendChild(itemRow(x,'subject',true,mx)));
  }
  wrap.appendChild(lc);
  return wrap;
}

function habitsPage(){
  const wrap=div('');
  wrap.innerHTML=`<h2 class="page-title">Habits</h2><p class="page-sub">Build and track your daily habits</p>`;
  wrap.appendChild(addFormCard('habit'));

  const tot=S.habits.reduce((a,x)=>a+x.timing,0);
  const lc=div('card');
  lc.innerHTML=`<div class="card-header"><div class="card-title">All Habits (${S.habits.length})</div><span class="time-badge" style="color:var(--accent2);border-color:var(--accent2)">${fmtMin(tot)} total</span></div>`;
  lc.appendChild(toolbar('habit'));
  const list=filtered(S.habits,'habit');
  if(!list.length){
    lc.innerHTML+=`<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">${S.search?'No habits match your search':'No habits yet — add one above!'}</div></div>`;
  } else {
    const mx=Math.max(...list.map(x=>x.timing));
    list.forEach(x=>lc.appendChild(itemRow(x,'habit',false,mx)));
  }
  wrap.appendChild(lc);
  return wrap;
}

function editModal(){
  const isSess=S.editType==='session';
  const item=S.editItem;
  const overlay=div('edit-overlay');
  const box=div('edit-box');
  box.appendChild(div('edit-title',isSess?'✏️ EDIT SESSION':'✏️ EDIT HABIT'));

  const ng=div('form-group',`<label>${isSess?'Subject Name':'Habit Name'}</label>`);
  ng.style.marginBottom='12px';
  const ni=mk('input');ni.type='text';ni.value=isSess?item.subject:item.habit;
  ng.appendChild(ni);box.appendChild(ng);

  const tg=div('form-group','<label>Duration</label>');
  tg.style.marginBottom='20px';
  const tw=makeTimeWidget('em');
  tw.set(item.timing);
  tg.appendChild(tw.wrap);box.appendChild(tg);

  const btns=div('');btns.style.cssText='display:flex;gap:8px';
  const sb=mk('button','btn btn-primary','Save Changes');
  const cb=mk('button','btn btn-ghost','Cancel');
  cb.onclick=()=>set({editItem:null,editType:null});
  sb.onclick=()=>{
    const name=ni.value.trim(),mins=tw.get();
    if(!name)return toast('Please enter a name');
    if(!mins)return toast('Please enter a valid duration');
    isSess?saveSessEdit(item.id,name,mins):saveHabEdit(item.id,name,mins);
  };
  btns.appendChild(sb);btns.appendChild(cb);box.appendChild(btns);
  overlay.appendChild(box);
  overlay.onclick=e=>{if(e.target===overlay)set({editItem:null,editType:null});};
  return overlay;
}

// ── MAIN RENDER ──
function render(){
  const root=document.getElementById('root');
  document.querySelector('.toast')?.remove();
  document.querySelector('.edit-overlay')?.remove();

  if(!S.user){root.innerHTML='';root.appendChild(nameScreen());return;}

  if(!document.getElementById('app-shell')){
    root.innerHTML=`
      <div id="app-shell" class="app">
        <div class="header">
          <div class="logo"><div class="logo-dot"></div><h1>STUDY+HABITS TRACKER</h1></div>
          <div class="user-badge" id="ubadge"></div>
        </div>
        <div class="main">
          <div id="sb-slot"></div>
          <div id="ct-slot" class="content"></div>
        </div>
      </div>`;
  }

  document.getElementById('ubadge').textContent='👤 '+S.user;

  const ss=document.getElementById('sb-slot');ss.innerHTML='';ss.appendChild(sidebar());
  const cs=document.getElementById('ct-slot');cs.innerHTML='';
  if(S.page==='dashboard')cs.appendChild(dashboard());
  else if(S.page==='sessions')cs.appendChild(sessionsPage());
  else if(S.page==='habits')cs.appendChild(habitsPage());

  if(S.editItem)document.body.appendChild(editModal());
  if(S.toast){
    const t=div('toast',`<div class="dot-accent"></div>${S.toast}`);
    document.body.appendChild(t);
  }
}

render();
</script>
</body>
</html>
